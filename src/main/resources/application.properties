#
# 遥测聚合引擎配置（本机运行，内存态）
#

# 事件时间滚动窗口长度（毫秒）
telemetry.window-millis=1000

# 水位线允许迟到（毫秒）：watermark = maxEventTime - allowed-lateness-millis
# 事件时间 < watermark 的事件按 LATE_BEHIND_WATERMARK 拒绝
telemetry.allowed-lateness-millis=500

# 摄取有界队列容量；写满后新事件立即按 QUEUE_FULL 拒绝（背压不阻塞写入线程）
telemetry.ingest-queue-capacity=10000

# 幂等去重表（eventId）容量上限，超出按 DEDUP_CAPACITY 拒绝
telemetry.dedup-capacity=1000000

# 标签基数保护：单窗口内单个 tag key 允许的不同 value 数
telemetry.max-tag-values-per-key=10000

# 标签基数保护：单窗口内允许的不同 series（metric+标签组合）数
telemetry.max-series-per-window=100000

# 同时保留的活动窗口数上限，超出按 TOO_MANY_ACTIVE_WINDOWS 拒绝
telemetry.max-active-windows=1000

# 调用链 span 总数上限，超出按 TAG_CARDINALITY 拒绝
telemetry.max-spans=500000

# 对外查询保留的已关闭窗口数 / 告警事件数
telemetry.retained-windows=500
telemetry.retained-alert-events=1000

# 本机服务端口
server.port=18090
