# ============================================================
# 遥测聚合器配置（均可通过环境变量 / 命令行覆盖）
# ============================================================

# ---- 窗口与水位线 ----
# 滚动窗口长度(ms)；窗口归属 = floor(eventTime / size) * size
telemetry.window.size-millis=10000
# 允许迟到(ms)：事件时间 < watermark - allowedLateness 即拒绝；
# 其所属窗口一旦按 watermark 定稿关闭也不再接受事件
telemetry.window.allowed-lateness-millis=5000
# 无事件时水位线是否按墙上时钟继续推进（测试可置 false 以获得完全确定性）
telemetry.window.advance-on-idle=true
telemetry.window.tick-interval=100ms

# ---- 摄取缓冲与背压 ----
telemetry.buffer.queue-capacity=10000
telemetry.buffer.offer-timeout=50ms
telemetry.buffer.result-timeout=2s

# ---- 基数与内存有界保护 ----
telemetry.cardinality.max-event-ids=200000
telemetry.cardinality.max-series-per-window=5000
telemetry.cardinality.max-sealed-windows=1000
telemetry.cardinality.max-traces=10000
telemetry.cardinality.max-spans-per-trace=200
telemetry.cardinality.max-tags-per-event=20
telemetry.cardinality.max-tag-value-length=200

# ---- 调用链回收 ----
telemetry.trace.retention=10m

# ---- 告警稳定性 ----
# 连续 N 个定稿窗口超阈值才 FIRING；连续 M 个恢复才回 OK；翻转冷却
telemetry.alert.breach-streak=2
telemetry.alert.recover-streak=2
telemetry.alert.cooldown=30s
# 规则格式：id,scope,service,metric,threshold,operator,tagK=tagV,...
# scope 取值 TAGS / TRACE；留空则使用内置默认规则 default-avg-gt-100
# 多条规则以分号分隔，例如：
# telemetry.alert.rules=cpu-hot,TAGS,svc-a,cpu,80,GT,host=h1;trace-slow,TRACE,svc-a,latency,200,GTE
telemetry.alert.rules=

# ---- Web ----
server.port=8080
spring.jackson.deserialization.fail-on-unknown-properties=false
